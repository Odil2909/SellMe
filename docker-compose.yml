services:
  postgres:
    image: postgres:17-alpine
    container_name: uyol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: uyol
      POSTGRES_USER: uyol
      POSTGRES_PASSWORD: uyol
    ports:
      - "5433:5432"
    volumes:
      - uyol-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uyol -d uyol"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  uyol-postgres-data:
