server.port=${PORT:4178}
server.address=0.0.0.0
spring.application.name=uyol-api
logging.level.root=WARN
logging.level.com.uyol.backend=INFO
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.sql.init.mode=always
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=160MB
uyol.data-dir=${DATA_DIR:./server-data}
uyol.cookie-secure=${COOKIE_SECURE:false}
server.error.include-message=never
uyol.support.ai-key=${OPENAI_API_KEY:}
uyol.support.ai-base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
uyol.support.ai-model=${OPENAI_MODEL:gpt-4o-mini}
uyol.support.telegram-token=${SUPPORT_TELEGRAM_BOT_TOKEN:}
uyol.support.telegram-operator-chat-id=${SUPPORT_TELEGRAM_OPERATOR_CHAT_ID:}
uyol.support.telegram-operator-user-id=${SUPPORT_TELEGRAM_OPERATOR_USER_ID:${SUPPORT_TELEGRAM_OPERATOR_CHAT_ID:}}
uyol.support.telegram-webapp-url=${SUPPORT_TELEGRAM_WEBAPP_URL:}
