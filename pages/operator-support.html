<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101a17">
  <title>Панель поддержки — uy-ol</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="../styles/operator-support.css">
</head>
<body>
  <main class="operator-app">
    <header class="topbar">
      <div><span class="eyebrow">UY-OL · SUPPORT</span><h1>Поддержка</h1></div>
      <button id="refresh" class="icon-button" aria-label="Обновить" title="Обновить">↻</button>
    </header>
    <nav class="filters" aria-label="Фильтр обращений">
      <button class="filter active" data-filter="pending">Ожидают <span id="pending-count">—</span></button>
      <button class="filter" data-filter="active">Активные</button>
      <button class="filter" data-filter="all">Все</button>
    </nav>
    <div id="notice" class="notice" role="status" hidden></div>
    <section class="workspace">
      <aside class="conversation-list" id="conversation-list" aria-label="Список обращений"></aside>
      <section class="conversation" id="conversation" aria-live="polite">
        <div class="empty-state"><div class="empty-icon">⌂</div><h2>Выберите обращение</h2><p>Переписка и действия появятся здесь.</p></div>
      </section>
    </section>
  </main>
  <script type="module" src="../scripts/operator-support.ts"></script>
</body>
</html>
